<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Certificates | Excellence Showcase</title>
    <meta name="description"
        content="A showcase of academic excellence and certificates.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #003366;
            --accent: #FFD700;
            --accent-hover: #FFCC00;
            --text-primary: #1A1A1A;
            --text-secondary: #4A4A4A;
            --bg-light: #F8F9FA;
            --bg-dark: #001326;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-strong: 0 20px 40px rgba(0, 0, 0, 0.1);
            --transition-smooth: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --container-width: 1100px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        .logo-text {
            font-family: 'Playfair Display', serif;
        }

        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header {
            height: 100px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            transition: var(--transition-smooth);
        }

        .header.scrolled {
            height: 70px;
            box-shadow: var(--shadow-soft);
        }

        .header .container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo-text .accent {
            color: var(--accent);
            font-weight: 400;
            font-style: italic;
        }

        .nav {
            display: flex;
            gap: 2.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: var(--transition-smooth);
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .certificates-section {
            padding: 140px 0 100px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
        }

        .certificate-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .certificate-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-strong);
        }

        .card-image-wrapper {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: #eee;
        }

        .certificate-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .certificate-card:hover .certificate-img {
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 51, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
        }

        .card-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-info-header .card-title {
            margin-bottom: 0px;
            font-size: 1.4rem;
        }

        .card-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .share-btn,
        .download-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: var(--primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
        }

        .share-btn:hover,
        .download-btn:hover {
            background: var(--accent);
            color: var(--primary);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .certificate-card:hover .card-overlay {
            opacity: 1;
        }

        .view-btn {
            background: var(--white);
            color: var(--primary);
            padding: 1rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .card-info {
            padding: 2rem;
            position: relative;
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .badge {
            background: rgba(255, 215, 0, 0.15);
            color: #b8860b;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 19, 38, 0.95);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease-in-out;
        }

        .close-modal {
            position: absolute;
            top: 30px;
            right: 40px;
            color: var(--white);
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .close-modal:hover {
            color: var(--accent);
            transform: rotate(90deg);
        }

        .modal-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }

        .modal-image {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            opacity: 0;
            animation: modalIn 0.5s 0.1s forwards cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-caption {
            margin-top: 2rem;
            color: var(--white);
            font-size: 1.25rem;
            font-family: 'Playfair Display', serif;
            opacity: 0;
            animation: fadeIn 0.5s 0.4s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes modalIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 992px) {
            .grid {
                gap: 2rem;
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 3rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card-image-wrapper {
                height: 300px;
            }

            .header {
                height: 80px;
            }

            .nav {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-text">My <span class="accent">Certificates</span></span>
            </div>
            <nav class="nav">
                <a href="#certificates" class="nav-link">Certificates</a>
            </nav>
        </div>
    </header>
    <section id="certificates" class="certificates-section">
        <div class="container">
            <div class="grid">
                <!-- Certificate 1 -->
                <div class="certificate-card" id="merit-scholarship" data-full="certificates/41279.jpg">
                    <div class="card-image-wrapper">
                        <img src="certificates/41279.png" alt="Certificate of Merit - Merit Scholarship"
                            class="certificate-img">
                        <div class="card-overlay">
                            <span class="view-btn">View Full Size</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-info-header">
                            <h3 class="card-title">Certificate of Merit</h3>
                            <div class="card-actions">
                                <button class="share-btn" title="Share Certificate" aria-label="Share Certificate">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                        <path
                                            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
                                    </svg>
                                </button>
                                <a href="certificates/41279.png" download="Certificate_of_Merit.png"
                                    class="download-btn" title="Download Certificate" aria-label="Download Certificate">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                                    </svg>
                                </a>
                            </div>
                        </div>
                        <p class="card-desc">Merit Scholarship award for the academic year 2025-26.</p>
                        <span class="badge">Scholarship</span>
                    </div>
                </div>

                <!-- Certificate 2 -->
                <div class="certificate-card" id="attendance-appreciation" data-full="certificates/41280.jpg">
                    <div class="card-image-wrapper">
                        <img src="certificates/41280.png" alt="Certificate of Appreciation - Attendance"
                            class="certificate-img">
                        <div class="card-overlay">
                            <span class="view-btn">View Full Size</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-info-header">
                            <h3 class="card-title">Certificate of Appreciation</h3>
                            <div class="card-actions">
                                <button class="share-btn" title="Share Certificate" aria-label="Share Certificate">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                        <path
                                            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
                                    </svg>
                                </button>
                                <a href="certificates/41280.png" download="Certificate_of_Appreciation.png"
                                    class="download-btn" title="Download Certificate" aria-label="Download Certificate">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                                    </svg>
                                </a>
                            </div>
                        </div>
                        <p class="card-desc">Recognition for Cent Percent Attendance in the academic year 2024-25.</p>
                        <span class="badge">Attendance</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div id="modal" class="modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content-wrapper">
            <img class="modal-image" id="modal-img">
            <div class="modal-caption" id="modal-caption"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.querySelector('.header');
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modal-img');
            const modalCaption = document.getElementById('modal-caption');
            const certificates = document.querySelectorAll('.certificate-card');
            const closeModal = document.querySelector('.close-modal');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
            const openModal = (card) => {
                const imgSrc = card.getAttribute('data-full');
                const title = card.querySelector('.card-title').innerText;
                const desc = card.querySelector('.card-desc').innerText;

                modal.style.display = 'block';
                modalImg.src = imgSrc;
                modalCaption.innerHTML = `<strong>${title}</strong> — ${desc}`;
                document.body.style.overflow = 'hidden';
            };

            certificates.forEach(card => {
                const shareBtn = card.querySelector('.share-btn');
                shareBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const title = card.querySelector('.card-title').innerText;
                    const text = card.querySelector('.card-desc').innerText;
                    const url = `${window.location.href.split('#')[0]}#${card.id}`;

                    if (navigator.share) {
                        navigator.share({ title, text, url }).catch(err => console.log('Error sharing:', err));
                    } else {
                        navigator.clipboard.writeText(url).then(() => {
                            const originalHTML = shareBtn.innerHTML;
                            shareBtn.innerHTML = '<span style="font-size: 14px">✓</span>';
                            setTimeout(() => shareBtn.innerHTML = originalHTML, 2000);
                        });
                    }
                });
                card.addEventListener('click', () => openModal(card));
            });
            const checkHash = () => {
                const hash = window.location.hash.slice(1);
                if (hash) {
                    const card = document.getElementById(hash);
                    if (card) {
                        // Ensure image is loaded before opening modal or just open
                        openModal(card);
                    }
                }
            };
            checkHash();
            window.addEventListener('hashchange', checkHash);
            const closeHandler = () => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
                if (window.location.hash) {
                    history.pushState("", document.title, window.location.pathname + window.location.search);
                }
            };

            closeModal.addEventListener('click', closeHandler);

            modal.addEventListener('click', (e) => {
                if (e.target === modal || e.target === document.querySelector('.modal-content-wrapper')) {
                    closeHandler();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'block') {
                    closeHandler();
                }
            });

            const observerOptions = {
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            certificates.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(40px)';
                card.style.transition = 'all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1)';
                observer.observe(card);
            });
        });

    </script>
</body>

</html>
